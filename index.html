<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>A股自设指数净值回测工具</title>
  <script src="https://cdn.jsdelivr.net/npm/echarts@5/dist/echarts.min.js"></script>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>

<div class="app-shell">

  <!-- ── Header ── -->
  <header class="app-header">
    <h1>A股自设指数净值回测工具</h1>
    <span id="saveIndicator">已自动保存</span>
  </header>

  <!-- ── Left sidebar: steps 1–3 ── -->
  <aside class="sidebar">

    <!-- Step 1: Excel import -->
    <div class="panel">
      <div class="section-head">
        <span class="step-badge">1</span>
        <h2>成分股导入</h2>
      </div>
      <div class="row">
        <input id="fileInput" type="file" accept=".xls,.xlsx" style="flex:1; min-width:0; font-size:12px;" />
        <button id="parseFileBtn">解析</button>
      </div>
      <div class="row">
        <label>应用到</label>
        <select id="targetPlanSelect" style="flex:1;"></select>
        <button id="applyPreviewBtn" class="secondary" disabled>应用</button>
      </div>
      <div class="hint" id="importSummary">未导入文件。解析时会强制保留6位股票代码（如 002879）。</div>
      <div id="previewWrap" style="margin-top:8px; display:none;">
        <div style="font-size:11px; color:var(--subtle); margin-bottom:4px;">解析预览（前100行）</div>
        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th style="width:70px;">代码</th>
                <th>名称</th>
                <th style="width:75px;">权重(%)</th>
              </tr>
            </thead>
            <tbody id="previewTableBody"></tbody>
          </table>
        </div>
      </div>
    </div>

    <!-- Step 2: Rebalancing plans -->
    <div class="panel">
      <div class="section-head">
        <span class="step-badge">2</span>
        <h2>调仓计划</h2>
        <button id="addPlanBtn" class="light" style="font-size:11px; padding:4px 10px;">＋ 新增计划</button>
        <button id="exportPlansBtn" class="light" style="font-size:11px; padding:4px 9px;" title="导出调仓计划为 JSON">↓ 导出</button>
        <button id="importPlansBtn" class="light" style="font-size:11px; padding:4px 9px;" title="从 JSON 导入调仓计划">↑ 导入</button>
        <input id="importPlansFile" type="file" accept=".json" style="display:none;" />
      </div>
      <div id="plansContainer"></div>
    </div>

    <!-- Step 3: Backtest params -->
    <div class="panel">
      <div class="section-head">
        <span class="step-badge">3</span>
        <h2>回测参数</h2>
      </div>
      <div class="params-grid">
        <div class="param-group">
          <label>开始日期</label>
          <input id="startDate" type="date" />
        </div>
        <div class="param-group">
          <label>结束日期</label>
          <input id="endDate" type="date" />
        </div>
        <div class="param-group">
          <label>调仓频率</label>
          <select id="rebalanceMode">
            <option value="none">仅按计划生效日</option>
            <option value="monthly" selected>按月再平衡</option>
            <option value="quarterly">按季度再平衡</option>
            <option value="semiannual">按半年再平衡</option>
            <option value="custom">自定义日期</option>
          </select>
        </div>
        <div class="param-group">
          <label>无风险利率</label>
          <input id="riskFreeRate" type="number" min="0" step="0.001" value="0.02" />
        </div>
      </div>
      <div id="customDatesRow" style="display:none; margin-bottom:6px;">
        <label style="display:block; margin-bottom:3px; font-size:11px;">再平衡日期（每行一个）</label>
        <textarea id="customDates" placeholder="2024-03-15&#10;2024-06-15"></textarea>
      </div>
      <button class="adv-toggle" id="advToggle">▸ 高级设置</button>
      <div class="adv-body" id="advBody">
        <div class="row" style="margin-top:4px;">
          <label>后端地址</label>
          <input id="backendUrl" type="text" value="http://127.0.0.1:8000" />
        </div>
        <div style="margin-top:8px; padding-top:8px; border-top:1px solid var(--border);">
          <label style="font-size:12px; font-weight:600; color:var(--text);">交易成本</label>
          <div style="display:grid; grid-template-columns:1fr 1fr 1fr; gap:6px; margin-top:4px;">
            <div class="param-group">
              <label>佣金(%)</label>
              <input id="commissionRate" type="number" min="0" step="0.0001" value="0.025" />
            </div>
            <div class="param-group">
              <label>印花税(%)</label>
              <input id="stampDutyRate" type="number" min="0" step="0.0001" value="0.05" />
            </div>
            <div class="param-group">
              <label>滑点(%)</label>
              <input id="slippageRate" type="number" min="0" step="0.0001" value="0.1" />
            </div>
          </div>
          <div class="hint" style="margin-top:3px;">佣金双边、印花税卖方单边、滑点双边。设为 0 则忽略成本。</div>
        </div>
        <div style="margin-top:8px; padding-top:8px; border-top:1px solid var(--border);">
          <label class="bm-label" style="font-size:12px;">
            <input type="checkbox" id="allowCash" />
            允许现金仓位（权重和不足 100% 时余额计为现金，按无风险利率计息）
          </label>
        </div>
      </div>
    </div>

  </aside>

  <!-- ── Right: results ── -->
  <main class="results-area">
    <div class="panel">
      <div class="section-head">
        <span class="step-badge done">4</span>
        <h2>回测结果</h2>
        <button id="exportCsvBtn" class="light" style="font-size:11px;padding:4px 9px;" disabled title="导出净值数据为 CSV">↓ CSV</button>
        <button id="exportImgBtn" class="light" style="font-size:11px;padding:4px 9px;" disabled title="保存图表为 PNG">↓ 截图</button>
        <button id="saveComparisonBtn" class="light" style="font-size:11px;padding:4px 9px; display:none;" title="保存当前回测结果用于对比">⊕ 对比</button>
      </div>
      <div id="statusBar">等待执行回测。</div>
      <div class="progress-panel" id="progressPanel" data-status="queued">
        <div class="progress-head">
          <span class="progress-stage" id="progressStage">等待执行</span>
          <span class="progress-percent" id="progressPercent">0%</span>
        </div>
        <div class="progress-track">
          <div class="progress-fill" id="progressFill"></div>
        </div>
        <div class="progress-meta">
          <span id="progressDetail">尚未开始。</span>
          <span class="progress-elapsed" id="progressElapsed">当前耗时：0.0 秒</span>
        </div>
      </div>
      <div class="warning-box" id="warningBox"></div>
      <div class="metrics" id="metricsContainer"></div>
      <div class="benchmark-bar" id="benchmarkBar">
        <span style="color:var(--subtle);">对比基准：</span>
        <label class="bm-label">
          <input type="checkbox" class="bm-check" value="000300" checked />
          <span class="bm-swatch" style="background:#f59e0b;"></span>沪深300
        </label>
        <label class="bm-label">
          <input type="checkbox" class="bm-check" value="000905" />
          <span class="bm-swatch" style="background:#10b981;"></span>中证500
        </label>
        <label class="bm-label">
          <input type="checkbox" class="bm-check" value="000001" />
          <span class="bm-swatch" style="background:#8b5cf6;"></span>上证指数
        </label>
      </div>
      <div class="benchmark-bar" id="comparisonBar" style="display:none;">
        <span style="color:var(--subtle);">对比回测：</span>
        <span id="comparisonCheckboxes"></span>
        <button id="clearComparisonsBtn" class="danger" style="font-size:10px;padding:3px 8px;margin-left:auto;">清空对比</button>
      </div>
      <div id="navChart"></div>
      <div id="periodicReturns" style="display:none; margin-bottom:12px;">
        <div style="display:flex; gap:12px; flex-wrap:wrap;">
          <div id="annualReturnsTable" style="flex:1; min-width:280px;"></div>
          <div id="monthlyHeatmap" style="flex:1; min-width:360px; height:300px;"></div>
        </div>
      </div>
      <div id="fallbackLogSection">
        <button id="fallbackLogToggle">▸ 兜底数据源日志 <span id="fallbackLogCount"></span></button>
        <div id="fallbackLogBody"></div>
      </div>
      <div class="report" id="reportBox"></div>
      <details class="notes-panel">
        <summary class="notes-summary">
          <span class="chevron">▾</span>
          <span>回测说明</span>
        </summary>
        <div class="notes-body" id="backtestNotesBody"></div>
      </details>
    </div>
  </main>

</div><!-- .app-shell -->

<!-- ── Floating action button ── -->
<div class="fab">
  <button id="runBacktestBtn">▶&nbsp; 执行回测</button>
</div>

<script src="app.js"></script>
</body>
</html>
